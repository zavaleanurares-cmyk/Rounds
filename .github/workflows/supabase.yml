name: Supabase

# Every push to main applies the migrations to production and redeploys the
# functions. Every pull request proves the migrations apply cleanly first, to a
# throwaway Postgres, with all three SQL suites run against them.
#
# Repository secrets this needs (Settings → Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN    a personal access token
#   SUPABASE_DB_PASSWORD     the database password
#   SUPABASE_PROJECT_REF     the ref from the dashboard URL
#
# And the function secrets, which are pushed from here so that rotating one is a
# repo change rather than something somebody remembers to do in a dashboard:
#
#   APNS_KEY_ID · APNS_TEAM_ID · APNS_PRIVATE_KEY   Live Activity updates
#   FCM_SERVER_KEY                                  Android push
#   SMS_PROVIDER_SID · SMS_PROVIDER_TOKEN · SMS_FROM   the safety SMS
#   STORE_WEBHOOK_SECRET                            entitlement webhook
#   INVITE_PAGE_URL                                 the invite page template

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: rounds_verify
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Every migration, then the RLS matrix, the escalation and the RPC rules
        run: bash supabase/tests/run.sh

      # The CLI has to be able to READ supabase/config.toml before it can do
      # anything with it, and that failed in the deploy job rather than here:
      # `Invalid db.major_version: 16`, thrown after pg_cron had already been
      # enabled on the live project. A file the deploy cannot parse is a
      # pull-request problem, not a production one.
      #
      # There is no offline `config validate`, so this runs a command that
      # reads the config and fails only on a config error — a connection error
      # is the expected outcome here and is not a failure.
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - name: The CLI can read supabase/config.toml
        run: |
          out=$(supabase db query --local "select 1" 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qi "ConfigLoadError\|Failed reading config\|Missing required field in config"; then
            echo "::error::supabase/config.toml is not valid for Supabase CLI $(supabase --version)."
            exit 1
          fi

  functions:
    name: The edge functions type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }

      # Nothing here had ever type-checked the functions. `tsc` skips them —
      # they run on Deno, not on the app's TypeScript config — so four files
      # that talk to APNs, FCM, the SMS provider and the store webhook were
      # checked by nothing at all. The first one that ran found a real error in
      # the APNs provider token, which signs every Live Activity update.
      #
      # This resolves the same esm.sh imports Supabase's own runtime does, so a
      # green check here is a statement about what will actually be deployed.
      - name: deno check
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  deploy:
    name: Apply to production
    needs: [verify, functions]
    # `!= 'pull_request'`, not `== 'push'`.
    #
    # This workflow offers workflow_dispatch — "Run workflow" in the Actions
    # tab — and the deploy step of docs/deploy.md tells you to use it. With
    # `== 'push'` that button ran the two verify jobs, SKIPPED the deploy, and
    # GitHub reported the run as Success, because a job skipped by its own `if`
    # is not a failure. A green tick on a workflow named "Apply to production"
    # that applied nothing to production is the worst kind of check there is.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # Pinned, and this is why. `version: latest` meant the deploy path took
      # an unreviewed upgrade on every run, and one of them removed
      # `supabase db execute` outright — the step failed printing the CLI's own
      # help text, having applied nothing. A tool that can change under a
      # deployment between two runs of the same commit is not a dependency that
      # should float. Bumping this is a deliberate act; check `db query`,
      # `db push`, `secrets set` and `functions deploy` still mean what they
      # mean here when you do.
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }

      - name: Which CLI
        run: supabase --version

      - name: Link
        run: supabase link --project-ref "$PROJECT_REF"

      # pg_cron is an extension, not a default. 00049 installs six schedules
      # WHERE IT EXISTS and prints a notice where it does not — which means a
      # project without it applies every migration successfully and schedules
      # nothing at all, safety escalation included. Enabling it before the push
      # is the difference between a working deployment and a silent one.
      - name: Enable pg_cron
        run: |
          supabase db query --linked \
            "create extension if not exists pg_cron with schema extensions;" \
          || supabase db query --linked \
            "create extension if not exists pg_cron;"

      - name: Apply migrations
        run: supabase db push

      # The check that makes the step above honest. A migration that applies and
      # schedules nothing looks identical to one that worked.
      - name: Prove the jobs are scheduled
        run: |
          set -euo pipefail
          expected="morning-recaps plan-reminders purge-accounts purge-locations purge-outbound safety-escalation weekly-recaps"
          # One row per job, and a word-match per name. Deliberately not parsing
          # the CLI's output shape: the previous version scraped a single
          # aggregated string with a regex, which is exactly the kind of thing
          # that keeps working until the tool reformats its table.
          got=$(supabase db query --linked "select jobname from cron.job order by jobname;")
          echo "$got"
          for job in $expected; do
            echo "$got" | grep -qw -- "$job" \
              || { echo "::error::$job is not scheduled. See docs/deploy.md."; exit 1; }
          done

      - name: Push the function secrets
        run: |
          set -euo pipefail
          declare -a pairs=(
            "APNS_KEY_ID=${{ secrets.APNS_KEY_ID }}"
            "APNS_TEAM_ID=${{ secrets.APNS_TEAM_ID }}"
            "APNS_PRIVATE_KEY=${{ secrets.APNS_PRIVATE_KEY }}"
            "FCM_SERVER_KEY=${{ secrets.FCM_SERVER_KEY }}"
            "SMS_PROVIDER_SID=${{ secrets.SMS_PROVIDER_SID }}"
            "SMS_PROVIDER_TOKEN=${{ secrets.SMS_PROVIDER_TOKEN }}"
            "SMS_FROM=${{ secrets.SMS_FROM }}"
            "STORE_WEBHOOK_SECRET=${{ secrets.STORE_WEBHOOK_SECRET }}"
            "INVITE_PAGE_URL=${{ secrets.INVITE_PAGE_URL }}"
          )
          set_these=()
          for pair in "${pairs[@]}"; do
            # An unset secret is an empty value; setting it would overwrite a
            # good one with nothing.
            [ -n "${pair#*=}" ] && set_these+=("$pair")
          done
          if [ ${#set_these[@]} -gt 0 ]; then
            supabase secrets set "${set_these[@]}"
          else
            echo "No function secrets configured — skipping."
          fi

      - name: Deploy the functions
        run: supabase functions deploy --use-api send-outbound store-webhook sync-entitlement invite

      # The drain cannot be scheduled from SQL: send-outbound is an edge
      # function and needs a key. It is the one step nothing here can do, and
      # skipping it means every message the product composes sits in a table
      # forever — so the run says so rather than finishing quietly.
      - name: Remind about the drain
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Migrations applied, six jobs scheduled, functions deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Still manual:** the outbound drain. \`send-outbound\` is an edge function and cannot be scheduled from SQL." >> "$GITHUB_STEP_SUMMARY"
          echo "Without it nothing is ever delivered — the safety SMS included. See \`docs/deploy.md\` §2." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "select count(*) filter (where sent_at is null) as waiting," >> "$GITHUB_STEP_SUMMARY"
          echo "       count(*) filter (where sent_at is not null) as sent" >> "$GITHUB_STEP_SUMMARY"
          echo "  from public.outbound;" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
