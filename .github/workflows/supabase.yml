name: Supabase

# The GitHub integration: every push to main applies migrations to production,
# and every PR gets its own preview branch with the schema applied.
#
# Set these once in the repo settings:
#   SUPABASE_ACCESS_TOKEN   a personal access token
#   SUPABASE_DB_PASSWORD    the database password
#   SUPABASE_PROJECT_REF    the project ref from the dashboard URL

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  pull_request:
    paths: ['supabase/**']

jobs:
  verify:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: rounds_verify
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash supabase/tests/run.sh

  deploy:
    name: Apply to production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push
          supabase functions deploy send-outbound store-webhook sync-entitlement
