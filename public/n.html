<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join the night · ROUNDS</title>
<!--
  The web preview for a plan or a night invite.

  This is the app's ONLY surface for people who haven't installed it, which
  makes it the growth loop rather than a fallback. It has to render the actual
  plan — time, venue, who's in — because a link that shows a store badge and
  nothing else is a link nobody taps twice.

  Served for /n/:code and /p/:id.

  This page used to have the demo seed baked into it — "Friday, properly",
  "Friday 21:30 · Roots", and three avatars reading AM/TU/MP, which are Ana
  Marin, Tudor and Mihai P. from src/data/seed.ts. Every real invite anybody
  sent showed a stranger somebody else's fictional evening, in the OG tags as
  well as on the page, and the only script on it rewrote the deep link.

  Two things fill it now. The edge function `invite` renders this file with the
  real values substituted, including the OG tags, which is what a link preview
  in a group chat needs — a crawler does not run JavaScript. When the page is
  served statically instead, the script at the bottom asks the same RPC and
  fills the visible half. Either way nothing here is invented: with no answer
  the page says it is an invitation and leaves the specifics out.

  The placeholders below are the substitution targets. They read as neutral
  copy on purpose, so a page served without either mechanism is still true.
-->
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:image" content="https://rounds.app/og/plan.png">
<meta name="theme-color" content="#06070B">
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#06070B; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .bg { position:fixed; inset:0; background:
    radial-gradient(60vw 60vw at 10% 0%, rgba(59,130,246,.32), transparent 62%),
    radial-gradient(50vw 50vw at 95% 20%, rgba(139,92,246,.24), transparent 62%); }
  main { position:relative; max-width:420px; margin:0 auto; padding:48px 20px; }
  .eyebrow { font-size:12px; letter-spacing:.22em; color:rgba(235,235,245,.3); text-transform:uppercase; }
  h1 { font-size:34px; line-height:1.08; margin:10px 0 6px; }
  .sub { color:rgba(235,235,245,.6); font-size:16px; margin:0 0 28px; }
  .card { background:#151A24; border:1px solid rgba(255,255,255,.08); border-radius:22px; padding:18px; margin-bottom:14px; }
  .who { display:flex; gap:-6px; margin-top:12px; }
  .av { width:34px; height:34px; border-radius:17px; display:grid; place-items:center; font-size:12px; font-weight:600; border:2px solid #151A24; margin-left:-8px; }
  .av:first-child { margin-left:0; }
  a.cta { display:block; text-align:center; padding:17px; border-radius:20px; background:linear-gradient(135deg,#3B82F6,#1D4ED8); color:#fff; text-decoration:none; font-weight:600; margin-top:22px; }
  a.alt { display:block; text-align:center; padding:15px; border-radius:20px; border:1px solid rgba(255,255,255,.12); color:#fff; text-decoration:none; margin-top:10px; }
  .note { color:rgba(235,235,245,.3); font-size:12px; text-align:center; margin-top:22px; line-height:1.6; }
</style>
</head>
<body>
<div class="bg"></div>
<main>
  <p class="eyebrow">You're invited</p>
  <h1 id="title">{{TITLE}}</h1>
  <p class="sub" id="when">{{WHEN}}</p>

  <!--
    A count, never the people. The preview is read by whoever has the link, so
    it carries no names, no handles and no faces — three initials on a public
    page are three people who did not agree to be on it.
  -->
  <div class="card" id="whoCard" hidden>
    <p class="eyebrow">Who's in</p>
    <p class="sub" id="who" style="margin:8px 0 0"></p>
  </div>

  <a class="cta" id="open" href="rounds://plan/">Open in ROUNDS</a>
  <a class="alt" id="store" href="https://rounds.app/get">Get the app</a>

  <p class="note">
    ROUNDS is a nightlife companion for adults of legal drinking age.<br>
    It shows a pace estimate, not a breathalyser reading.
  </p>
</main>
<script>
  // Try the app first; fall through to the store if nothing takes the link.
  // Deliberately no auto-redirect on desktop — a store page nobody asked for.
  var parts = location.pathname.split('/').filter(Boolean);
  var id = parts.pop() || '';
  var kind = location.pathname.indexOf('/n/') === 0 ? 'n' : 'p';
  document.getElementById('open').href = (kind === 'n' ? 'rounds://night/' : 'rounds://plan/') + id;

  // Anything still holding a placeholder was not substituted server-side, which
  // means this page was served statically. Fall back to neutral copy first, so
  // no visitor ever sees a template marker, then try to fill it for real.
  function el(x) { return document.getElementById(x); }
  function placeholder(node, fallback) {
    if (node && node.textContent.indexOf('{{') === 0) node.textContent = fallback;
  }
  placeholder(el('title'), 'A night out');
  placeholder(el('when'), 'Open the app for the details');

  // The RPC is granted to `anon` and returns a title, a time, a venue name and
  // a count — nothing that identifies anybody. Configured at build time; with
  // no configuration the neutral copy above is the whole page.
  var API = document.body.dataset.api || '';
  var KEY = document.body.dataset.key || '';
  if (API && KEY && id) {
    fetch(API + '/rest/v1/rpc/invite_preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
      body: JSON.stringify({ p_kind: kind, p_code: id })
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (rows) {
        var p = rows && rows[0];
        if (!p) return;
        if (p.title) el('title').textContent = p.title;
        var when = [];
        if (p.starts_at) {
          when.push(new Date(p.starts_at).toLocaleString(undefined, {
            weekday: 'long', hour: '2-digit', minute: '2-digit'
          }));
        }
        if (p.venue) when.push(p.venue);
        if (when.length) el('when').textContent = when.join(' · ');
        if (p.people > 0) {
          el('who').textContent = p.people === 1 ? '1 person in' : p.people + ' people in';
          el('whoCard').hidden = false;
        }
      })
      .catch(function () { /* the neutral copy is already correct */ });
  }
</script>
</body>
</html>
